name: Validate and deploy datasets
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build Next.js with the Netlify adapter
        run: npx --no-install netlify build --offline --context deploy-preview
        env:
          NETLIFY_TELEMETRY_DISABLED: '1'
      - run: node scripts/check-netlify-output.mjs
      - run: npm test
  deploy:
    needs: validate
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: datasets-netlify-production
      cancel-in-progress: false
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: ${{ vars.NETLIFY_SITE_ID || '2994a09f-11bc-40e1-8a3a-d3e3a91455ff' }}
      COMMIT_REF: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Check deployment configuration
        run: |
          test -n "$NETLIFY_AUTH_TOKEN" || { echo 'Set NETLIFY_AUTH_TOKEN in the GitHub production environment.' >&2; exit 1; }
          test "$NETLIFY_SITE_ID" = '2994a09f-11bc-40e1-8a3a-d3e3a91455ff' || { echo 'Unexpected Netlify site ID.' >&2; exit 1; }
      - run: npm ci
      - name: Skip superseded revisions
        id: revision
        run: |
          current="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [ "$current" = "$GITHUB_SHA" ]; then
            echo 'current=true' >> "$GITHUB_OUTPUT"
          else
            echo 'current=false' >> "$GITHUB_OUTPUT"
            echo 'Skipping superseded revision.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Build and deploy through Netlify CLI
        if: steps.revision.outputs.current == 'true'
        run: npx --no-install netlify deploy --site "$NETLIFY_SITE_ID" --context production --prod --json > .netlify-result.json
      - name: Verify deployed catalogue
        if: steps.revision.outputs.current == 'true'
        run: |
          url="$(node -e 'const d=require("./.netlify-result.json");if(!d.deploy_url||!d.deploy_id)process.exit(1);process.stdout.write(d.deploy_url)')"
          node scripts/verify-deployment.mjs "$url" "$GITHUB_SHA"
          node scripts/verify-deployment.mjs 'https://finfolk-datasets.netlify.app' "$GITHUB_SHA"
          node -e 'const fs=require("fs"),d=require("./.netlify-result.json");fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,`Verified Netlify deployment ${d.deploy_id}\n\n${d.deploy_url}\n\nSource: ${process.env.GITHUB_SHA}\n`)'
